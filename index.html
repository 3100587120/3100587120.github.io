<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转...</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-family: system-ui, -apple-system, sans-serif;
            color: #333;
        }
        .tip { font-size: 18px; margin-bottom: 20px; }
        .btn {
            padding: 16px 48px;
            background: #e67e22;
            color: #fff;
            border-radius: 8px;
            font-size: 18px;
            text-decoration: none;
            display: none;
        }
        .wechat-tip {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 16px;
            text-align: center;
            display: none;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="wechat-tip">请点击右上角 → 在浏览器中打开</div>
    <p class="tip" id="tipText">正在跳转到下载页...</p>
    <a href="" class="btn" id="downloadBtn" download>点击下载原神</a>

    <script>
        // 国内iOS App Store 原神官方地址
        const iosUrl = 'https://apps.apple.com/cn/app/%E5%8E%9F%E7%A5%9E/id1467190251';
        // 安卓官方下载接口，直接触发APK下载，不跳转下载页
        const androidUrl = 'https://ys-api.mihoyo.com/event/download_porter/link/ys_cn/official/android_default';

        const ua = navigator.userAgent;
        const isIOS = /iPhone|iPad|iPod/i.test(ua);
        const isAndroid = /Android/i.test(ua);
        const isWechat = /MicroMessenger/i.test(ua);

        // 微信环境统一提示
        if (isWechat) {
            document.querySelector('.wechat-tip').style.display = 'block';
        }

        if (isIOS) {
            // iOS自动跳转App Store
            setTimeout(() => {
                window.location.href = iosUrl;
            }, 1000);
        } else if (isAndroid) {
            // 安卓显示下载按钮，点击直接下载
            document.getElementById('tipText').innerText = '点击下方按钮下载';
            const btn = document.getElementById('downloadBtn');
            btn.style.display = 'inline-block';
            btn.href = androidUrl;
        } else {
            // 电脑端跳转官网
            setTimeout(() => {
                window.location.href = 'https://ys.mihoyo.com/';
            }, 1000);
        }
    </script>
</body>
</html>
